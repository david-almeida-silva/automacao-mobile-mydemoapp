name: Testes Mobile Android - MyDemoApp

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  mobile-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Instalar Appium Server e UiAutomator2
      run: |
        npm install -g appium
        appium driver install uiautomator2

    - name: Habilitar aceleração de hardware KVM no Linux
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-4.rules
        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

    - name: Subir Emulador Android, Iniciar Appium e Rodar Testes
      uses: ReactiveCircus/android-emulator-runner@v2
      with:
        api-level: 29
        target: default
        arch: x86_64
        profile: Nexus 6
        script: |
          appium --log-level info &
          sleep 10
          mvn clean test

    - name: Gerar Relatório Allure com Maven
      if: always()
      run: mvn allure:report

    - name: Publicar relatório no GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: target/site/allure-maven-plugin